name: CI/CD

# A PR to dev or main is verified. A push to dev or main is verified and its image is published to
# GHCR: dev -> :dev, main -> :prod, plus an immutable :<env>-<sha> tag to roll back to.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A new push to a PR cancels the old run. A push to dev or main never does, so a publish is never
  # cut in half.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Build & Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        # Caches dependencies and validates the Gradle wrapper checksum.
        uses: gradle/actions/setup-gradle@v4

      - name: Build (compile + spotless + checkstyle + pmd + test)
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        # Uploaded even when the build fails, to be able to inspect them.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish image
    needs: verify
    # The template repository itself has nothing to deploy.
    if: github.event_name == 'push' && !github.event.repository.is_template
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Image tags for the branch
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "$GITHUB_REF_NAME" in
            main) environment=prod ;;
            dev) environment=dev ;;
            *) echo "::error::No environment for branch $GITHUB_REF_NAME"; exit 1 ;;
          esac
          echo "tags=$image:$environment,$image:$environment-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The VMs are amd64. Add linux/arm64 to run the images on Apple Silicon (slower build).
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
