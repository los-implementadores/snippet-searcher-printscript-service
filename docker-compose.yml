# Local development: this service and its database. The whole platform (proxy, UI, the other
# services, Redis) is started from snippet-searcher-infra.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: printscript
      POSTGRES_USER: printscript
      POSTGRES_PASSWORD: printscript
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U printscript"]
      interval: 5s
      retries: 10

  printscript:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/printscript
      DB_USER: printscript
      DB_PASSWORD: printscript
      AUTH_ISSUER_URI: ${AUTH_ISSUER_URI:?set AUTH_ISSUER_URI in .env}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?set AUTH_AUDIENCE in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      NEW_RELIC_AGENT_ENABLED: ${NEW_RELIC_AGENT_ENABLED:-false}
      NEW_RELIC_LICENSE_KEY: ${NEW_RELIC_LICENSE_KEY:-}
    ports:
      - "${PORT:-8080}:8080"

volumes:
  db-data:
